http {
    # 启用WebSocket支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    
    server {
        listen 80;
        
        location /ws {
            websocket_handler;  # 启用WebSocket处理
            
            # 设置超时
            websocket_read_timeout 60s;
            websocket_write_timeout 60s;
        }
    }
}